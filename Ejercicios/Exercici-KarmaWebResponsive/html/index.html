<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Karma</title>
    <meta name="description" content="Karma - Bring WiFi with you, everywhere you go.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../img/favicon.ico">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="header">
        <div class="header__inner">
            <a href="#" class="logo">
                <img src="../img/karma-logo.svg" alt="Karma logo">
            </a>

            <nav class="nav">
                <ul class="nav__list">
                    <li><a href="#" class="nav__link nav__link--active">Meet Karma</a></li>
                    <li><a href="#" class="nav__link">How it Works</a></li>
                    <li><a href="#" class="nav__link">Store</a></li>
                    <li><a href="#" class="nav__link">Blog</a></li>
                    <li><a href="#" class="nav__link">Help</a></li>
                    <li><a href="#" class="nav__link">Login</a></li>
                </ul>
            </nav>

            <button class="menu-button" aria-label="Open menu">
                <img src="../img/menu-hamburger.svg" alt="">
            </button>
        </div>
    </header>

    <section class="hero">
        <div class="hero__content">
            <h1 class="hero__title">Introducing Karma</h1>
            <p class="hero__subtitle">Bring WiFi with you, everywhere you go.</p>
            <a href="#" class="btn">Learn More</a>
        </div>
    </section>

    <main class="features">
        <h2 class="features__title">Everyone needs a little Karma.</h2>

        <div class="features__grid">
            <div class="feature">
                <img src="../img/icon-devices.svg" alt="" class="feature__icon">
                <h3 class="feature__title">Internet for all devices</h3>
            </div>

            <div class="feature">
                <img src="../img/icon-coffee.svg" alt="" class="feature__icon">
                <h3 class="feature__title">Boost your productivity</h3>
            </div>

            <div class="feature">
                <img src="../img/icon-refill.svg" alt="" class="feature__icon">
                <h3 class="feature__title">Pay as You Go</h3>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p class="footer__text">Join us on</p>
        <ul class="social">
            <li>
                <a href="#" class="social__link">
                    <img src="../img/twitter-icon.svg" alt="Twitter">
                </a>
            </li>
            <li>
                <a href="#" class="social__link">
                    <img src="../img/facebook-icon.svg" alt="Facebook">
                </a>
            </li>
            <li>
                <a href="#" class="social__link">
                    <img src="../img/instagram-icon.svg" alt="Instagram">
                </a>
            </li>
        </ul>
        <p class="footer__copy">&copy; Karma Mobility, Inc.</p>
    </footer>

</body>
</html>
